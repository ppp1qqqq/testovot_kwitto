[project]
name = "kvitto-payments"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 ругается на Depends(...) в аргументах, а для FastAPI это обычный приём
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
